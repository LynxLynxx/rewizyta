name: rewizyta_view_models
description: Presentation models - UI-shaped data derived from domain models, presentation enums, formatters (Polish dates, phones, plurals) and the LocalizedException family. Depends on flutter only for BuildContext in localized exceptions.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  intl: ^0.20.3
  meta: ^1.18.0
  rewizyta_localization:
    path: ../rewizyta_localization
  rewizyta_models:
    path: ../rewizyta_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0
  rewizyta_shared:
    path: ../rewizyta_shared
