targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text instead of unix seconds, so local rows carry the same
          # timestamp representation as the Postgres side (docs/BACKEND_SCHEMA.md).
          store_date_time_values_as_text: true
      json_serializable:
        options:
          # Sync payloads use the Postgres column names.
          field_rename: snake
          explicit_to_json: true
