name: rewizyta_repositories
description: Data layer - the drift database (tables, DAO-less queries), DTOs for sync payloads and the repository interfaces with their implementations. Pure Dart; the app supplies the QueryExecutor.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.35.0
  json_annotation: ^4.12.0
  meta: ^1.18.0
  rewizyta_models:
    path: ../rewizyta_models
  rewizyta_shared:
    path: ../rewizyta_shared

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  json_serializable: ^6.14.1
  leancode_lint: ^27.0.0
  test: ^1.30.0
