name: rewizyta
description: Offline-first client and service reminder app for one-person field technicians.
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.1
  intl: ^0.20.3
  rewizyta_blocs:
    path: ../../packages/rewizyta_blocs
  rewizyta_localization:
    path: ../../packages/rewizyta_localization
  rewizyta_models:
    path: ../../packages/rewizyta_models
  rewizyta_repositories:
    path: ../../packages/rewizyta_repositories
  rewizyta_services:
    path: ../../packages/rewizyta_services
  rewizyta_shared:
    path: ../../packages/rewizyta_shared
  rewizyta_view_models:
    path: ../../packages/rewizyta_view_models
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
