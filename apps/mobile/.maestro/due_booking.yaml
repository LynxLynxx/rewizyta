# Journey 3 in docs/APP_FLOW.md from Terminy: an overdue client is booked from
# its row without opening the card, and the row shows the booking.
# "Dzwoń" is skipped: the emulator has no call to come back from.
# Starts from an empty database.
# ASCII input only: Maestro's Android driver cannot type Polish letters.
# The last visit (14.10.2025) and the first service type's 12-month cycle put
# the next one on 14.10.2026, so the client is overdue on any later run date.
# Tomorrow, the second day chip, always has its whole grid (see booking.yaml).
# The row's tags read as one merged node with the name, hence the .* around
# "umówiony"; the button is its own node.
appId: org.rsapps.rewizyta
name: Due list - book from the row
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Nie masz jeszcze żadnych klientów."
    timeout: 30000

# An overdue client
- tapOn: "Dodaj klienta"
- tapOn: "(?s)Imię i nazwisko albo nazwa.*"
- inputText: "Jan Kowalski"
- tapOn: "(?s)Telefon.*"
- inputText: "601234567"
- hideKeyboard
- scrollUntilVisible:
    element: "(?s)Ostatnia wizyta.*"
- tapOn: "(?s)Ostatnia wizyta.*"
- inputText: "14.10.2025"
- hideKeyboard
- scrollUntilVisible:
    element: "Zapisz klienta"
- tapOn: "Zapisz klienta"
- assertVisible: "Jan Kowalski"

# Saving lands on the card, which covers the tab bar (root navigator): back to
# the list first.
- back
- assertVisible: "(?s)Jan Kowalski.*"

# Terminy: on the list, not booked yet
- tapOn: "(?s)Terminy.*"
- assertVisible: "PO TERMINIE"
- assertVisible: "(?s)Jan Kowalski.*"
- assertNotVisible: "(?s).*umówiony.*"

# Book from the row: tomorrow's first hour
- tapOn: "Umów termin"
- assertVisible: "Klient chce dokładnie tę godzinę"
- tapOn:
    text: "(?s).*wolne.*"
    index: 1
- tapOn: "\\d\\d:00"
- tapOn: "(?s)Umów na.*"
- assertVisible: "Umówiono wizytę."

# Still on Terminy, the row tagged and its button turned
- assertVisible: "PO TERMINIE"
- assertVisible: "(?s).*umówiony.*"
- assertVisible: "Zmień termin"
- assertNotVisible: "Umów termin"
