# Keeps the GitHub Actions in the workflows current. Dart/Flutter dependencies are
# bumped by hand: the pub workspace shares one lockfile and the Jaspr sites pin
# their own, which Dependabot's pub support does not handle well yet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
