# Keeps the free-tier Supabase projects (staging and, until it moves to Pro,
# production) from being paused for inactivity.
#
# Free projects are paused after 7 days without API traffic. This job calls the
# `keepalive()` RPC (supabase/migrations/..._keepalive_heartbeat.sql) through
# PostgREST every second day; it updates the one row in `public.keepalive`, so
# the project sees a real table write, and `pinged_at` shows the last ping.
# (A no-op RPC twice a week did not stop staging from being paused.) Drop the
# production leg once production is on Pro or self-hosted. See docs/TRD.md,
# "Hosting and the free-tier pause".
#
# Secrets, per GitHub environment (never repo-level): SUPABASE_URL
# (https://<ref>.supabase.co) and SUPABASE_PUBLISHABLE_KEY, on "staging" and on
# "production-keepalive". The latter is a separate, unprotected environment:
# "production" needs a reviewer and accepts only v* tags, which a scheduled run
# from main can't satisfy, and both values are public anyway (they ship in the
# site bundle).
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 */2 * *" # every second day, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production-keepalive]
    environment: ${{ matrix.environment }}
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets not configured; nothing to do."; exit 0
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/body)"
          [ "$code" = "200" ]
