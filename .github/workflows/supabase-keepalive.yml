# Keeps a free-tier Supabase project from being paused for inactivity.
#
# Free projects are paused after 7 days without API traffic. This job calls the
# `keepalive()` RPC (supabase/migrations/..._keepalive.sql) through PostgREST
# twice a week, which counts as activity. It is meant for the dev/staging
# project only: production must be on the Pro plan (never pauses, daily
# backups) or self-hosted, because a paused project also stops the reminder
# jobs. See docs/ARCHITECTURE.md, "Hosting and the free-tier pause".
#
# Secrets: SUPABASE_URL (https://<ref>.supabase.co) and SUPABASE_PUBLISHABLE_KEY.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secrets not configured; nothing to do."; exit 0
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/body)"
          [ "$code" = "200" ]
