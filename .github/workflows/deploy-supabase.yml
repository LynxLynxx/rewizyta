# Deploys the backend (supabase/migrations, supabase/functions) to a hosted project.
#
#   push to main touching supabase/   -> staging, automatically
#   tag v*                            -> production, after the reviewer on the
#                                        "production" environment approves
#   workflow_dispatch                 -> either, chosen by input
#
# Each GitHub environment (Settings > Environments) holds three secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token from the Supabase dashboard
#   SUPABASE_PROJECT_REF    <ref> in https://<ref>.supabase.co (a secret so the
#                           hosted ref never appears in this public repo)
#   SUPABASE_DB_PASSWORD    the database password chosen at project creation
#
# Function secrets (SMS_PROVIDER, gateway tokens, BILLING_ENABLED) are set once by
# hand with `supabase secrets set --project-ref <ref>` and are not part of the
# deploy. Hosted auth settings are configured in the dashboard, not pushed from
# config.toml. See docs/TRD.md, "Environments and deployment".
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/**
      - .github/workflows/deploy-supabase.yml
    tags: [v*] # path filters are not evaluated for tags: a release always deploys
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# One deploy per environment at a time; never cancel a running one.
concurrency:
  group: deploy-supabase-${{ inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0 # the version verified locally; bump on purpose, not by accident

      - name: Check the environment secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set on this GitHub environment"; exit 1
            fi
          done

      - name: Link the project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: supabase db push

      - name: Deploy edge functions
        run: |
          if find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' | grep -q .; then
            supabase functions deploy
          else
            echo "No edge functions yet; nothing to deploy."
          fi
