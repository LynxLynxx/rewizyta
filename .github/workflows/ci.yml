# Format, analyse and test every package on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and personal-data scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still public
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - run: tool/check_secrets.sh --history
      - run: tool/check_secrets.sh

  mobile:
    name: Flutter workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: dart pub global activate melos
      - run: melos bootstrap --no-private # hooks skipped: sites have their own job
      - run: melos run gen
      - run: melos run l10n
      - run: melos run format
      - run: melos run analyze
      - run: melos run layering
      - run: melos run test

  backend:
    name: Backend migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0 # the version verified locally; bump on purpose, not by accident

      # A fresh Postgres with every migration applied in order, then the SQL linter.
      # This is what `supabase db push` will do to staging on merge.
      - run: supabase db start
      - run: supabase db lint --level warning --fail-on error

  sites:
    name: Jaspr site (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [waitlist, website]
    defaults:
      run:
        working-directory: apps/${{ matrix.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.13.2

      - run: dart pub get

      # The CLI is released in step with the jaspr package, so use the locked version.
      - name: Install the jaspr CLI
        run: |
          version=$(awk '/^  jaspr:/{f=1} f&&/version:/{gsub(/"/,"",$2);print $2;exit}' pubspec.lock)
          dart pub global activate jaspr_cli "$version"

      - run: dart format --output=none --set-exit-if-changed lib
      - run: dart analyze --fatal-infos
      - run: jaspr build
