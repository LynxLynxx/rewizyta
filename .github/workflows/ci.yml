# Format, analyse and test every package on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and personal-data scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: a secret removed in a later commit is still public
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - run: tool/check_secrets.sh --history
      - run: tool/check_secrets.sh

  mobile:
    name: Flutter workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: dart pub global activate melos
      - run: melos bootstrap --no-private # hooks skipped: sites have their own job
      - run: melos run gen
      - run: melos run l10n
      - run: melos run format
      - run: melos run analyze
      - run: melos run layering
      - run: melos run test

  sites:
    name: Jaspr site (${{ matrix.site }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        site: [waitlist, website]
    defaults:
      run:
        working-directory: apps/${{ matrix.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - run: dart pub get

      # The CLI is released in step with the jaspr package, so use the locked version.
      - name: Install the jaspr CLI
        run: |
          version=$(awk '/^  jaspr:/{f=1} f&&/version:/{gsub(/"/,"",$2);print $2;exit}' pubspec.lock)
          dart pub global activate jaspr_cli "$version"

      - run: dart format --output=none --set-exit-if-changed lib
      - run: dart analyze --fatal-infos
      - run: jaspr build
